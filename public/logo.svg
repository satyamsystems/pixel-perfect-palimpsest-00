<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none" width="240" height="48" role="img" aria-label="Trajectify.AI logo">
  <defs>
    <linearGradient id="traj-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="60%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#FF6B4A" />
    </linearGradient>
    <linearGradient id="traj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0B5F58" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark (38x38 rounded) -->
  <g transform="translate(5, 5)">
    <rect width="38" height="38" rx="10" fill="url(#traj-bg)" />
    
    <!-- Base / Trunk curve -->
    <path d="M8 29 C 14 27, 18 21, 22 19" stroke="#FAF8F4" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Upper trajectory branch -->
    <path d="M22 19 C 25 17, 28 11, 31 10" stroke="#FF6B4A" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Lower trajectory branch -->
    <path d="M22 19 C 25 21, 28 23, 31 24" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
    
    <!-- Decision node -->
    <circle cx="22" cy="19" r="2.8" fill="#FAF8F4" />
    <!-- Destination nodes -->
    <circle cx="31" cy="10" r="2.2" fill="#FF6B4A" />
    <circle cx="31" cy="24" r="1.8" fill="#2DD4BF" />
  </g>
  
  <!-- Wordmark -->
  <text x="54" y="31" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.03em" fill="#14232B" class="brand-text">Trajectify<tspan fill="#0F766E">.AI</tspan></text>
</svg>
